name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ECommerce.sln

      - name: Build Solution
        run: dotnet build ECommerce.sln -c Release --no-restore

      - name: Run Unit Tests
        run: |
          dotnet test tests/ECommerce.Domain.UnitTests/ECommerce.Domain.UnitTests.csproj -c Release --no-build --verbosity normal
          dotnet test tests/ECommerce.Application.UnitTests/ECommerce.Application.UnitTests.csproj -c Release --no-build --verbosity normal

      - name: Run Integration Tests
        run: dotnet test tests/ECommerce.Api.IntegrationTests/ECommerce.Api.IntegrationTests.csproj -c Release --no-build --verbosity normal

      - name: Build Docker Image
        run: docker build -t ecommerce-api:ci .
