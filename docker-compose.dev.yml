# Local development environment only — this is not a deployment artifact.
#
# It runs the API in Development with the placeholder JWT signing key, the mock Stripe gateway
# and auto-migrate-and-seed. None of that may ever face public traffic: production deployments
# must follow the requirements in README.md (ASPNETCORE_ENVIRONMENT=Production, a real Jwt__Key,
# real Stripe credentials, migrations applied deliberately, and a proxy-aware forwarded-header
# trust list). The startup guards in AddInfrastructure reject this configuration outside Development.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ecommerce;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Issuer=ECommerceApi
      - Jwt__Audience=ECommerceClient
      - Jwt__Key=SuperSecretDevelopmentKeyForECommerceApiTestingOnlyMustBeLongerThan32Bytes!
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      - Stripe__UseMockGateway=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
